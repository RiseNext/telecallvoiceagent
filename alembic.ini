# Alembic configuration.
#
# The database URL is deliberately NOT set here. It comes from
# `RN_MIGRATION_DATABASE_URL` if present, otherwise from `DATABASE_URL_DIRECT`
# via rn_core settings — see migrations/env.py. Putting a DSN in a committed ini
# file is how credentials end up in git.
#
# Migrations always use the DIRECT connection, never the pooled one: they need
# session semantics (advisory locks, `SET`, DDL in one session) that a
# transaction-mode pooler does not provide.

[alembic]
script_location = packages/persistence/src/rn_persistence/migrations
prepend_sys_path = .
path_separator = os

# Timestamped, ordered, readable filenames.
file_template = %%(rev)s_%%(slug)s

# Timezone for the `date` in generated files. UTC, like everything else.
timezone = UTC

[post_write_hooks]
# Generated migrations are formatted like the rest of the codebase, so a
# revision does not fail CI on style.
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
