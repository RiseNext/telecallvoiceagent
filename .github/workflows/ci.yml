name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes an in-flight run on the same branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Live tests hit real, paid providers. They must never run automatically.
  RUN_LIVE_PROVIDER_TESTS: "false"

jobs:
  python:
    name: Python — lint, types, boundaries, tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: risenext
          POSTGRES_PASSWORD: risenext
          POSTGRES_DB: risenext_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U risenext -d risenext_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://risenext:risenext@localhost:5432/risenext_test
      DATABASE_URL_DIRECT: postgresql+asyncpg://risenext:risenext@localhost:5432/risenext_test
      REDIS_URL: redis://localhost:6379/0
      # Integration tests use this service container instead of starting a
      # testcontainer. Locally the variable is unset and testcontainers spins up
      # a throwaway database on an ephemeral port, so neither environment
      # depends on port 5432 being free.
      RN_TEST_DATABASE_URL: postgresql+asyncpg://risenext:risenext@localhost:5432/risenext_test
      RN_MIGRATION_DATABASE_URL: postgresql+asyncpg://risenext:risenext@localhost:5432/risenext_test

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # --frozen fails if uv.lock is stale relative to the manifests, which is
      # exactly what we want: a dependency change must be committed with its lock.
      - name: Sync workspace
        run: uv sync --frozen

      - name: Format check
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check . --output-format=github

      - name: Type check
        run: uv run mypy .

      # The layering rules are the architecture. If this fails, the fix is a
      # design conversation, not a contract edit.
      - name: Architecture boundaries
        run: uv run lint-imports --verbose

      # Proves the migration round-trips before any test relies on the schema.
      # A downgrade that does not fully reverse its upgrade is only discovered
      # when you need to roll back, which is the worst moment to discover it.
      - name: Migration round-trip
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head

      # Fails if a model was edited without generating a revision. `--autogenerate`
      # against an up-to-date database must produce an empty migration.
      - name: Migrations match the models
        run: |
          uv run alembic check

      # The agent compliance gates, run as their own step so a failure reads as
      # "AI disclosure regressed" rather than being one red line in a 300-test run.
      # Compliance, opt-out and injection resistance are gates, not scores: a version
      # that regresses on one cannot be published, whatever its average
      # (AGENT_ARCHITECTURE §11.1).
      #
      # Tier 1 only: scripted callers, a scripted provider, in-memory tool services.
      # No network egress and no paid API — which is what the Phase-2 definition of
      # done requires of it.
      - name: Agent evaluation — Tier 1 compliance gates
        run: uv run pytest -m agent_eval

      - name: Tests
        run: uv run pytest -m "not live and not load" --cov --cov-report=term-missing

  web:
    name: Frontend — lint, types, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - run: npm run format:check

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run build

  # Added in the phase that introduces the first migration (see docs/ROADMAP.md).
  # It must check: migrations apply forward from empty, downgrade cleanly, and
  # that no migration takes a lock that would block a live calls table.
  #
  # migrations:
  #   name: Alembic — forward, backward, lock safety
