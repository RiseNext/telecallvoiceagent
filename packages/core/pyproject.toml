[project]
name = "rn-core"
version = "0.1.0"
description = "Shared kernel: configuration, errors, IDs, time, structured logging, telemetry, redaction"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pydantic>=2.11.0",
    "pydantic-settings>=2.10.0",
    "structlog>=25.4.0",
    "opentelemetry-api>=1.36.0",
    "opentelemetry-sdk>=1.36.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rn_core"]
