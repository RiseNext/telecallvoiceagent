[project]
name = "rn-agent"
version = "0.1.0"
description = "Agent definitions, instruction compilation, the typed tool registry, guardrails and turn policy — deliberately framework-free"
requires-python = ">=3.12,<3.14"
# DELIBERATELY has no LangChain/LangGraph dependency.
#
# The voice gateway must be able to resolve an agent definition, render its
# instructions and export its tool schemas WITHOUT dragging an orchestration
# framework into the audio process. Tool schemas are produced from plain Pydantic
# models, which is all either consumer needs:
#   - rn_voice          -> flat OpenAI Realtime function specs
#   - rn_orchestration  -> LangChain StructuredTool wrappers
# Enforced by the "Only rn_orchestration may import LangChain/LangGraph" contract
# in the root pyproject.toml. See ADR-004.
dependencies = [
    "rn-core",
    "rn-domain",
    "rn-services",
    "rn-providers",
]

[tool.uv.sources]
rn-core = { workspace = true }
rn-domain = { workspace = true }
rn-services = { workspace = true }
rn-providers = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rn_agent"]
