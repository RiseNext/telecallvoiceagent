[project]
name = "rn-providers"
version = "0.1.0"
description = "Outbound adapters for every external system: telephony, realtime voice, STT, TTS, LLM, embeddings, messaging, storage, calendar"
requires-python = ">=3.12,<3.14"
# The base install stays deliberately small so the voice gateway does not drag in
# object-storage / calendar SDKs it never touches. Each vendor lives behind an extra.
dependencies = [
    "rn-core",
    "rn-domain",
    "httpx>=0.28.0",
    "websockets>=15.0",
    "tenacity>=9.1.0",
]

[project.optional-dependencies]
openai = ["openai>=2.0.0"]
aws = ["aioboto3>=15.0.0"]
# Audio transcoding lives at the telephony-adapter boundary (ADR-003). It is an
# extra rather than a base dependency so the API and workers, which never touch a
# media frame, do not carry numpy.
audio = [
    "numpy>=2.2.0",
    "soxr>=0.5.0",   # also replaces the stdlib `audioop` removed in Python 3.13 (PEP 594)
]
# Identity is a provider like any other: the platform authenticates against an
# IdentityProvider seam so Clerk can be replaced without touching route code.
clerk = [
    "clerk-backend-api>=6.0.1,<7",
    "svix>=1.99.0",   # Svix-signed webhook verification (HMAC over the RAW request body)
]
sarvam = []          # HTTP/WebSocket only — no vendor SDK required
exotel = []          # HTTP/WebSocket only — no vendor SDK required
all = ["rn-providers[openai,aws,clerk,audio,sarvam,exotel]"]

[tool.uv.sources]
rn-core = { workspace = true }
rn-domain = { workspace = true }
rn-providers = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rn_providers"]
