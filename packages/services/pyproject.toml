[project]
name = "rn-services"
version = "0.1.0"
description = "Application layer: use cases and business services shared by the API, the voice gateway and the workers"
requires-python = ">=3.12,<3.14"
dependencies = [
    "rn-core",
    "rn-domain",
    "rn-persistence",
    "rn-providers",
    "redis[hiredis]>=6.4.0",
    "python-dateutil>=2.9.0",
]

[tool.uv.sources]
rn-core = { workspace = true }
rn-domain = { workspace = true }
rn-persistence = { workspace = true }
rn-providers = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rn_services"]
