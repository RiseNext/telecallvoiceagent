[project]
name = "rn-persistence"
version = "0.1.0"
description = "PostgreSQL persistence: SQLAlchemy models, Alembic migrations, repositories, unit of work, pgvector access"
requires-python = ">=3.12,<3.14"
dependencies = [
    "rn-core",
    "rn-domain",
    "sqlalchemy[asyncio]>=2.0.43",
    "alembic>=1.16.0",
    "asyncpg>=0.30.0",
    "pgvector>=0.4.1",
    "greenlet>=3.2.0",
]

[tool.uv.sources]
rn-core = { workspace = true }
rn-domain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rn_persistence"]
