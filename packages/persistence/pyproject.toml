[project]
name = "rn-persistence"
version = "0.1.0"
description = "PostgreSQL persistence: SQLAlchemy models, Alembic migrations, repositories, unit of work, pgvector access"
requires-python = ">=3.12,<3.14"
dependencies = [
    "rn-core",
    "rn-domain",
    "sqlalchemy[asyncio]>=2.0.43",
    "alembic>=1.16.0",
    "asyncpg>=0.30.0",
    "greenlet>=3.2.0",
    # NOTE: no `pgvector` client. Phase 1 creates no vector column, and open
    # decision D-8 (embedding model, width, column type, index, partitioning) is
    # not resolved until Phase 3 — see ADR-010. A declared vector dependency in
    # the package that must NOT grow a vector column is exactly the affordance
    # that invites someone to add one "while we're in here", which is the failure
    # ROADMAP's own Phase-1 risk section names. It comes back with the schema.
]

[tool.uv.sources]
rn-core = { workspace = true }
rn-domain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rn_persistence"]
