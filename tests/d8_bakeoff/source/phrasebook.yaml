# -----------------------------------------------------------------------------
# QUERY TEMPLATES
#
# `{service}` fans out across all seven services. Business-wide intents carry no
# slot and generate one query each.
#
# ADVERSARIAL INTENTS - pricing, lending, guarantees, out_of_scope,
# policy_override - are the ones that matter most. Each has a correct answer
# that is a REFUSAL OR A CONSTRAINT, and a retrieval system that cannot surface
# the constraint leaves the model with nothing to refuse from.
# -----------------------------------------------------------------------------
