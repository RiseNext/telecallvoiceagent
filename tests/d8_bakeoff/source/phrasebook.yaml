    and xs-deva-out-of-scope in the consolidated review - and the reviewer supplied
    each replacement wording as their approved form, so both carry native_reviewed
    under the same rule. Every subset is review-complete; the corpus is still not
    benchmark-ready, because `size` and `adversarial_present` remain blocked on
    business input.

# -----------------------------------------------------------------------------
# SERVICE NAME TRANSLATIONS
#
# The Devanagari and Telugu forms are transliterations of the English service
# names, because that is how these services are actually referred to in Indian
# business conversation - "Technology Solutions" is not translated to a native
# compound, it is said in English or transliterated. THAT JUDGEMENT IS EXACTLY
# WHAT NEEDS REVIEWING: a reviewer may well say the natural form is different,
# or that the English should be kept unchanged in Devanagari text.
# -----------------------------------------------------------------------------
