  # ==================================================== CROSS-SCRIPT
  # The query is in Devanagari or Telugu; every gold passage is English. This is
  # the subset D-8 exists for and the one nobody publishes numbers on.
  #
  # `name_script` forces the service name into the query's script, so the
  # rendered query does not come out half-Latin and stop being cross-script.
  - id: xs-deva-what-is
