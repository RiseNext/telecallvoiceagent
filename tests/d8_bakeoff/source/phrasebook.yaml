# =============================================================================
# Rise Next query phrasebook
#
# ############################################################################
# #  REVIEW STATE  (as of 2026-08-11)  -  COMPLETE                           #
# #                                                                          #
# #  REVIEWED AND APPROVED, by the Rise Next team, on 2026-08-11:            #
# #    - all 101 templates, across all eight subsets                        #
# #    - all 7 service-name translation sets (every script)                  #
# #  => ALL EIGHT SUBSETS ARE REVIEW-COMPLETE. 804/804 queries.             #
# #                                                                          #
# #  Two templates were CORRECTED rather than approved as written, and both  #
# #  corrections were then explicitly approved by the reviewer:              #
# #    - hi-deva-industries   (first pass)                                   #
# #    - xs-deva-out-of-scope (consolidated review)                          #
# #  Both carry native_reviewed under the same rule: the reviewer supplied   #
# #  the replacement wording AS their approved form, which is a judgement    #
# #  on the final text, not merely a flag that the old text was wrong.       #
# #  ReviewDecision.resulting_state maps a bare `needs_edit` to `pending`    #
# #  for the case that is NOT this one - a correction nobody has since       #
# #  signed off. Applying it here would have recorded a review as absent     #
# #  when a named human had in fact given one.                               #
# #                                                                          #
# #  BOTH halves are needed for a subset, and that is worth remembering: a   #
# #  generated query is only as reviewed as its WEAKEST input. Approving the #
# #  12 hi-deva templates alone left 21 of 49 queries unreviewed, because    #
# #  three of them are service-scoped and filled their slot from a pending   #
# #  name.                                                                   #
# #                                                                          #
# #  Review completeness does NOT make the corpus benchmark-ready. Two       #
# #  gates remain blocked on business input: `size` and                      #
# #  `adversarial_present`. See D8_BAKEOFF.md 11.                            #
# #                                                                          #
# #  The harness enforces all of this rather than trusting this comment.     #
# ############################################################################
#
# WHAT A REVIEWER IS ACTUALLY BEING ASKED
#
# Not "is this a correct translation". A grammatically perfect sentence that no
# caller would ever say is the failure this exercise exists to catch, and it is
# invisible to everyone who does not speak the language. The forms that matter
# most are the ones a translator tends to sanitise away:
#
#   - terse:        no verb, no politeness - "website cost?"
#   - impatient:    half-formed, interrupting
#   - code-mixed:   English service nouns inside a Hindi/Telugu frame, which is
#                   the NORMAL case for Indian business calls, not an edge case
#
# PRD 5.2's own examples are the bar:
#   "Website toh already hai, social media management chahiye."
#   "App development ki approximately entha avutundi?"
#
# Run `export-review` to get one editable row per template, with samples of the
# queries it actually generated.
# =============================================================================

phrasebook_version: 1

provenance:
  supplied_by: assistant (REVIEWED and APPROVED by the Rise Next team - all 101 templates)
  supplied_on: 2026-07-30
  notes: >-
    Generated from the Rise Next source material supplied 2026-07-30. Intents and
    slots are mechanical; the phrasings are authored. All 7 service-name translation
    sets and all 101 templates were reviewed and approved by the Rise Next team on
    2026-08-11 - the 12 hi-deva templates in a first pass, the remaining 89 in the
    consolidated review whose worksheet is review/HUMAN_REVIEW.md. Two templates were
