  # ---- capability-scoped ----------------------------------------------------
  # `{capability}` fans out over the named sub-services. The capability NAME STAYS
  # IN ENGLISH in every subset below, including the Devanagari and Telugu frames.
  #
  # That is not a shortcut around translating 69 names. It is how these terms are
  # actually said on an Indian business call: a caller asks about "E-Commerce
  # Platforms" or "WhatsApp Automation" inside a Hindi or Telugu sentence, not a
  # transliteration of it. A REVIEWER SHOULD OVERTURN THIS IF IT IS WRONG - it is
  # a judgement about speech, which is exactly what review is for.
  - id: en-cap-atom
    subset: en
    intent: capability_specific
    style: canonical
    text: "do you provide {capability}"
    review_status: native_reviewed
    reviewed_by: Rise Next team
    reviewed_on: 2026-08-11

