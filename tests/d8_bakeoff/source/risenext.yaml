# -----------------------------------------------------------------------------
# 7. POLICIES & LIMITATIONS
#
# `authority: policy` - guardrail knowledge whose STATEMENT is the correct
# answer. RAG-eligible, deliberately: a "can you guarantee X?" question needs a
# retrievable constraint, or the model has nothing to refuse from.
# -----------------------------------------------------------------------------
policies:
  - id: policy-never-promise
    title: What Rise Next never promises
    text: >-
      Rise Next never promises guaranteed loan approvals, guaranteed Google
      rankings, guaranteed sales or revenue, exact pricing without understanding
      the project, fixed delivery dates before scope is finalized, unlimited
      revisions, lifetime free maintenance, features outside the agreed scope, or
      legal or financial advice beyond general guidance.
    authority: policy
    # `kind` is what the gold map keys on. It is schema, not prose: the builder
    # resolves "which passage answers a guarantees question" through
    # (section, kind), so renaming this id would not break the corpus but
    # removing this line would - silently, by producing goldless queries that
    # look exactly like retrieval failures.
    kind: never_promise
    never_rag: false
    source_reference: "Rise Next source material 2026-07-30, section: POLICIES & LIMITATIONS"
    review_status: reviewed
    reviewed_by: Rise Next team
    reviewed_on: 2026-07-30

  # The nine never-promises, split out one per entry.
  #
  # `kind: never_promise_item` rather than `never_promise`, so the gold map can
  # grade the full list above at 2 and each item at 1: a candidate that finds the
  # specific clause has found the constraint, and one that finds the whole list
  # has found it more completely.
  #
  # Every line below is the supplied wording. Nothing was added, softened or
  # generalised - this is the list the agent refuses from, and a paraphrase here
  # would be a different promise.
