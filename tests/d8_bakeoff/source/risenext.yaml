# -----------------------------------------------------------------------------
# 9. PRICING POLICY
#
# `authority: policy` and RAG-ELIGIBLE, and this is the deliberate choice worth
# understanding.
#
# The instinct is to hide anything price-related from retrieval. That instinct is
# backwards here. The danger is not that retrieval returns "quotations are
# customised" - that IS the correct answer. The danger is that retrieval returns
# a NUMBER. Withholding the policy would leave every pricing question with no
# correct passage at all, which is exactly the situation in which a model
# invents a figure.
#
# There are no numeric prices anywhere in this file. See `authoritative_values`.
# -----------------------------------------------------------------------------
pricing_policy:
  - id: policy-pricing-customised
    title: How Rise Next prices work
    text: >-
      Rise Next provides customized quotations. Every business has unique
      requirements, so Rise Next prepares customized quotations based on your
      goals, required features, integrations, timeline, and project scope. Once
      Rise Next understands your needs, the team will provide a detailed proposal.
    authority: policy
    never_rag: false
    source_reference: "Rise Next source material 2026-07-30, section: PRICING POLICY"
    review_status: reviewed
    reviewed_by: Rise Next team
    reviewed_on: 2026-07-30

  - id: policy-pricing-approximate
    title: When a customer asks for an approximate budget
    text: >-
      Some standard services have indicative pricing, but most Rise Next projects
      are custom-built. It is best to understand your requirements first so Rise
      Next can recommend the right solution and provide an accurate estimate.
    authority: policy
    never_rag: false
    source_reference: "Rise Next source material 2026-07-30, section: PRICING POLICY"
    review_status: reviewed
    reviewed_by: Rise Next team
    reviewed_on: 2026-07-30

