# =============================================================================
# Rise Next Solutions Pvt. Ltd. — OFFICIAL SOURCE MATERIAL
#
# Supplied by the Rise Next team on 2026-07-30 and treated as the current
# authoritative business source for the demo/company knowledge.
#
# EVERY ENTRY HERE IS SOURCE-GROUNDED. Nothing in this file was invented.
# Where the supplied material is silent, this file is silent: there are no
# timelines, no team sizes, no office locations, no support hours and NO NUMERIC
# PRICES, because none were supplied.
#
# -----------------------------------------------------------------------------
# THE TWO CLASSIFICATIONS THAT MATTER
#
# `authority` is not bookkeeping. It decides whether retrieval may serve a fact.
#
#   descriptive    what we do. Retrieval may return it.
#   policy         a business rule whose STATEMENT is the correct answer -
#                  pricing policy, never-promise list, lender disclaimer.
#                  Retrieval may return it, and MUST, or a pricing question has
#                  no correct passage and the model is left to invent one.
#   authoritative  a current exact VALUE - a price figure, a slot, an id.
#                  Never RAG. THIS SECTION IS EMPTY: no prices were supplied.
#   structural     CRM field definitions. Schema, not content. Never RAG, and
#                  never even a passage.
#
# The pricing distinction, stated once: "quotations are customised" is a POLICY
# and belongs in the knowledge base. "Rs 49,999" would be an AUTHORITATIVE VALUE
# and must never be. The supplied material contains the first and none of the
# second, which is why `authoritative_values` below is empty and stays empty
# until real structured pricing data exists.
# =============================================================================

